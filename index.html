<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE FOR FOOD!!!!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
    <section class="hero" aria-label="Welcome">
        <video class="section-video" autoplay muted loop playsinline preload="metadata">
            <source src="assets/videos/homepage.mp4" type="video/mp4">
        </video>
        <header class="site-header">
            <h1>Code For Food</h1>
            <nav>
                <a href="pages/login.html">Login</a>
                <a href="pages/rewards.html">Rewards</a>
                <a href="pages/game.html">Game</a>
                <a href="pages/leaderboard.html">Leaderboard</a>
            </nav>
        </header>
    </section>

    <section class="about" id="about" aria-label="About">
        <div class="about-sticky-media">
            <video class="section-video" autoplay muted loop playsinline preload="metadata">
                <source src="assets/videos/about-section-video.mp4" type="video/mp4">
            </video>
        </div>
    </section>

    <!-- Scroll deep past About → white light → /pages/game.html -->
    <div id="portal-flash" class="portal-flash" aria-hidden="true"></div>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script src="js/supabase.js"></script>
    <script src="js/helpers.js"></script>
    <script src="questions/questions.js"></script>
    <script src="js/script.js"></script>
    <script type="module" src="js/voice-agent.js"></script>
</body>
</html>
