<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard | Code For Food</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="leaderboard-page" data-page="leaderboard">
    <main class="leaderboard-stage" aria-labelledby="leaderboard-title">
        <h1 id="leaderboard-title" class="visually-hidden">Leaderboard — top players</h1>

        <a href="./game.html" class="dashboard-back leaderboard-back" aria-label="Back to game">
            <img src="../assets/images/back%20button.png" alt="" width="112" height="112" decoding="async">
        </a>

        <div class="leaderboard-data">
            <ol class="leaderboard-list" id="leaderboard-list" aria-label="Top 10 players by best quiz score"></ol>
            <p class="leaderboard-status" id="leaderboard-status" role="status" aria-live="polite">Loading scores…</p>
        </div>

        <a href="./game.html" class="leaderboard-play-btn" aria-label="Keep climbing — play the quiz"></a>
    </main>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="../assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script type="module" src="../js/leaderboard-page.js"></script>
</body>
</html>
