<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game | Code For Food</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="game-page" data-page="game">
    <main class="game-stage" id="game-stage" aria-label="Game">
        <a href="../index.html" class="game-back-home" aria-label="Back to home">
            <img
                src="../assets/images/Back%20to%20Home%20cutout.png"
                alt=""
                width="360"
                height="203"
                decoding="async"
                fetchpriority="high">
        </a>

        <div class="game-quiz-grid" aria-label="Available quizzes">
            <a href="./js-quiz-q1.html" class="game-quiz-slot game-quiz-slot--1" aria-label="Basics of JS Quiz">
                <img src="../assets/images/Basics%20of%20JS%20Quiz.png" alt="" width="220" height="126" decoding="async">
            </a>
        </div>

        <nav class="game-dash-nav" aria-label="Quiz dashboard">
            <a href="./rewards.html" class="game-dash-btn game-dash-btn--rewards">
                <img src="../assets/images/my%20rewards%20button.png" alt="My rewards" width="655" height="169" decoding="async">
            </a>
            <a href="./points-to-revise.html" class="game-dash-btn game-dash-btn--revise">
                <img src="../assets/images/Points%20to%20Revise.png" alt="Points to revise" width="680" height="175" decoding="async">
            </a>
            <a href="./leaderboard.html" class="game-dash-btn game-dash-btn--leaderboard">
                <img src="../assets/images/leaderboard.png" alt="Leaderboard" width="640" height="165" decoding="async">
            </a>
            <a href="./profile.html" class="game-dash-btn game-dash-btn--login">
                <img src="../assets/images/LOGIN.png" alt="My profile" width="640" height="165" decoding="async">
            </a>
        </nav>
    </main>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="../assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script src="../js/supabase.js"></script>
    <script src="../js/helpers.js"></script>
    <script src="../questions/questions.js"></script>
    <script src="../js/script.js"></script>
    <script type="module" src="../js/voice-agent.js"></script>
</body>
</html>
