<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile | Code For Food</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="profile-page" data-page="profile">
    <button type="button" class="dashboard-back" id="profile-back" aria-label="Go back to previous page">
        <img src="../assets/images/back%20button.png" alt="" width="112" height="112" decoding="async">
    </button>

    <header class="site-header profile-page-header">
        <h1>Code For Food</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./game.html">Game</a>
            <a href="./rewards.html">Rewards</a>
            <a href="./leaderboard.html">Leaderboard</a>
        </nav>
    </header>

    <main class="profile-main">
        <section class="profile-card" aria-labelledby="profile-title">
            <div class="profile-avatar-wrap">
                <div class="profile-avatar" id="profile-avatar" role="img" aria-label="Profile picture">
                    <span class="profile-avatar-initials" id="profile-avatar-initials">?</span>
                </div>
                <p class="profile-avatar-label">Profile picture</p>
            </div>

            <h2 id="profile-title">My profile</h2>

            <dl class="profile-details">
                <div class="profile-detail">
                    <dt>Username</dt>
                    <dd id="profile-username">—</dd>
                </div>
                <div class="profile-detail">
                    <dt>Email</dt>
                    <dd id="profile-email">—</dd>
                </div>
                <div class="profile-detail profile-detail--id">
                    <dt>User ID</dt>
                    <dd id="profile-id" class="profile-id-value">—</dd>
                </div>
            </dl>

            <section class="profile-settings" aria-labelledby="profile-settings-title">
                <h3 id="profile-settings-title" class="profile-settings-title">Account settings</h3>

                <form class="profile-settings-form" id="username-form" novalidate>
                    <h4 class="profile-settings-subtitle">Edit username</h4>
                    <div class="auth-field">
                        <label for="profile-username-input">Display name</label>
                        <input
                            id="profile-username-input"
                            name="username"
                            type="text"
                            autocomplete="nickname"
                            required
                            minlength="2"
                            maxlength="32"
                            placeholder="Your display name"
                        >
                    </div>
                    <div class="profile-settings-actions">
                        <button type="button" class="auth-btn auth-btn--primary" id="btn-save-username">Save username</button>
                    </div>
                </form>

                <form class="profile-settings-form" id="password-form" novalidate>
                    <h4 class="profile-settings-subtitle">Change password</h4>
                    <div class="auth-field">
                        <label for="profile-current-password">Current password</label>
                        <input
                            id="profile-current-password"
                            name="current-password"
                            type="password"
                            autocomplete="current-password"
                            required
                            minlength="6"
                            placeholder="••••••••"
                        >
                    </div>
                    <div class="auth-field">
                        <label for="profile-new-password">New password</label>
                        <input
                            id="profile-new-password"
                            name="new-password"
                            type="password"
                            autocomplete="new-password"
                            required
                            minlength="6"
                            placeholder="••••••••"
                        >
                    </div>
                    <div class="auth-field">
                        <label for="profile-confirm-password">Confirm new password</label>
                        <input
                            id="profile-confirm-password"
                            name="confirm-password"
                            type="password"
                            autocomplete="new-password"
                            required
                            minlength="6"
                            placeholder="••••••••"
                        >
                    </div>
                    <div class="profile-settings-actions">
                        <button type="button" class="auth-btn auth-btn--primary" id="btn-change-password">Change password</button>
                    </div>
                </form>
            </section>

            <nav class="profile-nav" aria-label="Site sections">
                <h3 class="profile-nav-title">Go to</h3>
                <ul class="profile-nav-list">
                    <li><a href="../index.html" class="profile-nav-btn">Home</a></li>
                    <li><a href="./game.html" class="profile-nav-btn">Game dashboard</a></li>
                    <li><a href="./js-quiz-q1.html" class="profile-nav-btn">JS quiz</a></li>
                    <li><a href="./rewards.html" class="profile-nav-btn">My rewards</a></li>
                    <li><a href="./points-to-revise.html" class="profile-nav-btn">Points to revise</a></li>
                    <li><a href="./leaderboard.html" class="profile-nav-btn">Leaderboard</a></li>
                </ul>
            </nav>

            <div class="profile-actions">
                <button type="button" class="auth-btn auth-btn--secondary" id="btn-sign-out">Sign out</button>
            </div>

            <p class="auth-message profile-message" id="profile-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="../assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script type="module" src="../js/profile-page.js"></script>
</body>
</html>
