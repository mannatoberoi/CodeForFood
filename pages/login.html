<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Code For Food</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="login-page" data-page="login">
    <header class="site-header login-page-header">
        <h1>Code For Food</h1>
        <nav>
            <a href="../index.html">Home</a>
            <a href="./profile.html">Profile</a>
            <a href="./rewards.html">Rewards</a>
            <a href="./game.html">Game</a>
            <a href="./leaderboard.html">Leaderboard</a>
        </nav>
    </header>

    <main class="login-main">
        <section class="auth-card" aria-labelledby="auth-title">
            <h2 id="auth-title">Log in</h2>
            <form id="auth-form" novalidate>
                <div class="auth-field">
                    <label for="username">Username</label>
                    <input
                        id="username"
                        name="username"
                        type="email"
                        autocomplete="username"
                        required
                        placeholder="you@example.com"
                    >
                </div>
                <div class="auth-field">
                    <label for="password">Password</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        required
                        minlength="6"
                        placeholder="••••••••"
                    >
                </div>
                <div class="auth-actions">
                    <button type="submit" class="auth-btn auth-btn--primary" id="btn-login">Log in</button>
                    <button type="button" class="auth-btn auth-btn--secondary" id="btn-signup">Sign up</button>
                </div>
            </form>
            <p class="auth-message" id="auth-message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="../assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script type="module" src="../js/login-page.js"></script>
</body>
</html>
