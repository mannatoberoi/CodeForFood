<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points to revise | Code For Food</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="revise-page">
    <a href="./game.html" class="dashboard-back" aria-label="Back to game">
        <img src="../assets/images/back%20button.png" alt="" width="112" height="112" decoding="async">
    </a>

    <div class="revise-wrong-list" id="revise-wrong-list" aria-label="Questions to revise"></div>

    <div class="revise-panel-actions" aria-label="Revise options">
        <a href="./revise-chat.html" class="revise-panel-btn revise-panel-btn--1" aria-label="Revise for my exam">
            <img src="../assets/images/revise%20button%201.png" alt="" width="96" height="48" decoding="async">
        </a>
        <a href="https://htmlcheatsheet.com/js/" class="revise-panel-btn revise-panel-btn--2" aria-label="Quick points to revise" target="_blank" rel="noopener noreferrer">
            <img src="../assets/images/revise%20button%202.png" alt="" width="118" height="59" decoding="async">
        </a>
        <a href="#" class="revise-panel-btn revise-panel-btn--3" aria-label="Topics you might need to read again">
            <img src="../assets/images/revise%20button%203.png" alt="" width="96" height="48" decoding="async">
        </a>
    </div>

    <div class="voice-agent-wrap" id="voice-agent-root">
        <div class="voice-agent-panel" id="voice-agent-panel" aria-hidden="true">
            <div class="voice-agent-panel-header">
                <span class="voice-agent-panel-title">Voice agent</span>
                <button type="button" class="voice-agent-panel-close" id="voice-agent-close" aria-label="Close chat">×</button>
            </div>
            <div class="voice-agent-messages" id="voice-agent-messages" aria-live="polite"></div>
        </div>
        <button type="button" class="voice-agent-fab" id="voice-agent-trigger" aria-label="Open voice agent" aria-pressed="false" aria-expanded="false" aria-controls="voice-agent-panel">
            <img src="../assets/images/voice%20agent.png" alt="" width="120" height="120" decoding="async">
        </button>
    </div>

    <script type="module" src="../js/points-revise-page.js"></script>
</body>
</html>
